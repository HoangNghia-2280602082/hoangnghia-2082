<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body{
    font-family: Arial;
    background: linear-gradient(120deg,#6a11cb,#2575fc);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:white;
    padding:40px;
    width:320px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
    text-align:center;
}

.login-box h2{
    margin-bottom:20px;
}

.input-box{
    margin-bottom:15px;
}

.input-box input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:10px;
    border:none;
    background:#2575fc;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1a5edb;
}

.error{
    color:red;
    margin-top:10px;
}
</style>

</head>

<body>

<div class="login-box">
    <h2>Login</h2>

    <form onsubmit="return login()">

        <div class="input-box">
            <input type="text" id="username" placeholder="Username" required>
        </div>

        <div class="input-box">
            <input type="password" id="password" placeholder="Password" required>
        </div>

        <button type="submit">Login</button>

        <div id="error" class="error"></div>

    </form>
</div>

<script>
function login(){

    let user=document.getElementById("username").value;
    let pass=document.getElementById("password").value;

    if(user==="admin" && pass==="123"){
        alert("Đăng nhập thành công");
        window.location.href="home.html";
    }
    else{
        document.getElementById("error").innerText="Sai tài khoản hoặc mật khẩu";
    }

    return false;
}
</script>

</body>
</html>
